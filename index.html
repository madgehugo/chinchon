<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">Chinchón</title>
<!-- The small picture in the browser tab. build_single.py inlines it, so keep this exact form. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!-- Files in this project (all in one folder; just open index.html):
       style.css  how it looks
       rules.js   the rules of Chinchón: deck, melds, scoring
       i18n.js    the text in English and Spanish, and t() to look it up
       ai.js      the CPU players
       game.js    game state, turns, rounds and scoring
       tests.js   self-tests for the rules (results appear in the console)
       ui.js      drawing the table, clicks, dragging, startup
     The scripts share one global scope, so the ORDER below matters:
     each file may use what the files above it define. -->
<link rel="stylesheet" href="style.css">
</head>

<body>
<h1 data-i18n="app.title">Chinchón</h1>

<!-- =========================================================
     HTML: the skeleton. It contains EMPTY containers; JavaScript
     fills them with cards. Each id is how JS finds its element.
     Text: an element with data-i18n="key" gets its text from STRINGS in
     i18n.js (data-i18n-title and data-i18n-aria do the same for the title
     and aria-label attributes). The English written here is only what shows
     if the script fails; the text of the seats and piles is filled in by
     ui.js on every render, so those elements start empty.
     ========================================================= -->
<div id="table">
  <div class="seat" id="seat-2">
    <div class="seat-name"></div>
    <div class="hand" id="hand-2"></div>
  </div>

  <div class="seat" id="seat-1">
    <div class="seat-name"></div>
    <div class="hand" id="hand-1"></div>
  </div>

  <div id="centre">
    <div id="piles">
      <div class="pile" id="draw-pile">
        <div id="draw-slot"></div>
        <div class="pile-label" id="draw-label"></div>
        <div class="pile-label" id="reshuffle-label"></div>
      </div>
      <div class="pile" id="discard-pile">
        <div id="discard-slot"></div>
        <div class="pile-label" id="discard-label"></div>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div class="seat" id="seat-3">
    <div class="seat-name"></div>
    <div class="hand" id="hand-3"></div>
  </div>

  <div class="seat" id="seat-0">
    <div class="seat-name"></div>
    <div class="hand" id="hand-0"></div>
  </div>
</div>

<!-- Main actions, right under your hand. Hints and Settings are toggles. -->
<div id="actions">
  <button id="sort-btn" data-i18n="btn.sort">Sort hand</button>
  <button id="close-btn" data-i18n="btn.close" disabled>Close round</button>
  <button id="next-btn" data-i18n="btn.next" disabled>Next round</button>
  <button id="results-btn" data-i18n="btn.results" disabled>Round results</button>
  <span class="spacer"></span>
  <button id="hints-btn" class="secondary" data-i18n="btn.hints" aria-pressed="false">Hints</button>
  <button id="help-btn" class="secondary" aria-expanded="false" aria-controls="help" data-i18n-title="btn.help" data-i18n-aria="btn.help" title="Help" aria-label="Help">?</button>
  <button id="settings-btn" class="secondary" aria-expanded="false" aria-controls="settings" data-i18n-title="btn.settings" title="Settings"><span aria-hidden="true">&#9881;</span> <span data-i18n="btn.settings">Settings</span></button>
  <select id="lang" data-i18n-aria="lang.label" data-i18n-title="lang.label" aria-label="Language" title="Language">
    <option value="en">English</option>
    <option value="es">Español</option>
  </select>
</div>

<!-- Settings panel: hidden until the Settings button is pressed.
     The option marked `selected` in each dropdown is the default on a first visit
     (loadSettings in ui.js falls back to it when nothing is saved). -->
<div id="settings" hidden>
  <label class="opt"><span data-i18n="set.sortBy">Sort by</span>
    <select id="sort-mode">
      <option value="number" data-i18n="set.sort.number">Number</option>
      <option value="suit" data-i18n="set.sort.suit">Suit</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.cpus">CPUs</span>
    <select id="cpu-count">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.level">CPU level</span>
    <select id="cpu-mode">
      <option value="hard" data-i18n="level.hard">Hard</option>
      <option value="medium" data-i18n="level.medium">Medium</option>
      <option value="easy" data-i18n="level.easy">Easy</option>
      <option value="mixed" data-i18n="level.mixed">Mixed</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.speed">CPU speed</span>
    <select id="cpu-speed">
      <option value="slow" data-i18n="set.speed.slow">Slow</option>
      <option value="normal" data-i18n="set.speed.normal" selected>Normal</option>
      <option value="fast" data-i18n="set.speed.fast">Fast</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.deck">Deck</span>
    <select id="deck-size">
      <option value="40" data-i18n="set.deck.40">40 cards</option>
      <option value="48" data-i18n="set.deck.48">48 cards (with 8s and 9s)</option>
    </select>
  </label>
  <!-- With 3 CPUs on the 40-card deck the draw pile runs out often: suggest the 48-card deck.
       Shown by renderToggles in ui.js; the button switches the deck like the dropdown does. -->
  <p id="deck-tip" hidden><span data-i18n="set.deckTip">With 4 players the 40-card deck runs out quickly. The 48-card deck means fewer reshuffles.</span>
    <button id="deck-tip-btn" class="secondary" data-i18n="set.deckTipBtn">Use 48 cards</button></p>
  <!-- "none" stands for no limit (null in state.maxReshuffles / state.maxReentries / state.roundLimit) -->
  <label class="opt"><span data-i18n="set.reshuffles">Reshuffles per round</span>
    <select id="reshuffles">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="none" data-i18n="set.noLimit">No limit</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.reentries">Re-entries per player</span>
    <select id="reentries">
      <option value="0">0</option>
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="none" data-i18n="set.noLimit">No limit</option>
    </select>
  </label>
  <label class="opt"><span data-i18n="set.rounds">Rounds per game</span>
    <select id="round-limit">
      <option value="none" data-i18n="set.noLimit" selected>No limit</option>
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
  </label>
  <button id="new-game" data-i18n="btn.newGame">New game</button>
  <!-- Keyboard help: style.css hides it on touch-only devices -->
  <p class="keys-help" data-i18n="set.keys">Keys: 1-8 discard · D draw pile · T take discard · C close · S sort · Enter next round · H help</p>
</div>

<!-- Asks before a deck change throws away a game in progress (browser pop-up
     dialogs are blocked in some places, so this is built into the page) -->
<div id="deck-confirm" hidden>
  <span id="deck-confirm-text"></span>
  <button id="deck-yes" data-i18n="confirm.yes">Start new game</button>
  <button id="deck-no" class="secondary" data-i18n="confirm.no">Keep playing</button>
</div>

<!-- Only visible while you are eliminated and must choose (see renderControls) -->
<div id="reentry" hidden>
  <span id="reentry-text"></span>
  <button id="reenter-yes" data-i18n="btn.reenter">Re-enter</button>
  <button id="reenter-no" data-i18n="btn.stayOut">Stay out</button>
</div>

<div id="scoreboard"></div>
<div id="analysis"></div>

<!-- Round results: opens automatically when a round ends (see renderResults in ui.js) -->
<div id="results" class="overlay" hidden>
  <div class="panel">
    <h2 id="results-title"></h2>
    <!-- Winner and final standings; only shown once the game is over (see renderGameOverBanner) -->
    <div id="results-banner" hidden></div>
    <div id="results-body"></div>
    <p id="results-notice"></p>
    <div class="panel-buttons">
      <button id="res-next" data-i18n="btn.next">Next round</button>
      <button id="res-reenter" data-i18n="btn.reenter">Re-enter</button>
      <button id="res-stayout" data-i18n="btn.stayOut">Stay out</button>
      <button id="res-newgame" data-i18n="btn.newGame">New game</button>
      <button id="res-hide" class="secondary" data-i18n="btn.hide">Hide</button>
    </div>
  </div>
</div>

<!-- Help: the rules, what each setting does and the keyboard keys. Opened by the ? button
     (or the H key). <details>/<summary> is a built-in fold-out section, so on a phone you open
     only the part you want; no JavaScript needed. All the text comes from the help.* keys in
     i18n.js, so the elements start empty. -->
<div id="help" class="overlay" hidden>
  <div class="panel help-panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <h2 id="help-title" data-i18n="help.title">How to play</h2>
    <details open><summary data-i18n="help.aim.h"></summary>
      <p data-i18n="help.aim.p"></p>
    </details>
    <details><summary data-i18n="help.cards.h"></summary>
      <p data-i18n="help.cards.p1"></p>
      <p data-i18n="help.cards.p2"></p>
    </details>
    <details><summary data-i18n="help.turn.h"></summary>
      <ul>
        <li data-i18n="help.turn.li1"></li>
        <li data-i18n="help.turn.li2"></li>
        <li data-i18n="help.turn.li3"></li>
        <li data-i18n="help.turn.li4"></li>
      </ul>
    </details>
    <details><summary data-i18n="help.melds.h"></summary>
      <ul>
        <li data-i18n="help.melds.li1"></li>
        <li data-i18n="help.melds.li2"></li>
        <li data-i18n="help.melds.li3"></li>
      </ul>
    </details>
    <details><summary data-i18n="help.close.h"></summary>
      <p data-i18n="help.close.p"></p>
      <ul>
        <li data-i18n="help.close.li1"></li>
        <li data-i18n="help.close.li2"></li>
        <li data-i18n="help.close.li3"></li>
        <li data-i18n="help.close.li4"></li>
      </ul>
    </details>
    <details><summary data-i18n="help.chinchon.h"></summary>
      <p data-i18n="help.chinchon.p"></p>
    </details>
    <details><summary data-i18n="help.scores.h"></summary>
      <ul>
        <li data-i18n="help.scores.li1"></li>
        <li data-i18n="help.scores.li2"></li>
        <li data-i18n="help.scores.li3"></li>
      </ul>
    </details>
    <details><summary data-i18n="help.deck.h"></summary>
      <p data-i18n="help.deck.p"></p>
    </details>
    <details><summary data-i18n="help.settings.h"></summary>
      <ul>
        <li data-i18n="help.settings.li1"></li>
        <li data-i18n="help.settings.li2"></li>
        <li data-i18n="help.settings.li3"></li>
        <li data-i18n="help.settings.li4"></li>
        <li data-i18n="help.settings.li5"></li>
        <li data-i18n="help.settings.li6"></li>
        <li data-i18n="help.settings.li7"></li>
        <li data-i18n="help.settings.li8"></li>
      </ul>
      <p data-i18n="help.settings.p"></p>
    </details>
    <details><summary data-i18n="help.screen.h"></summary>
      <ul>
        <li data-i18n="help.screen.li1"></li>
        <li data-i18n="help.screen.li2"></li>
        <li data-i18n="help.screen.li3"></li>
        <li data-i18n="help.screen.li4"></li>
      </ul>
      <p class="keys-help" data-i18n="help.keys"></p>
    </details>
    <div class="panel-buttons">
      <button id="help-close" data-i18n="btn.closeHelp">Close</button>
    </div>
  </div>
</div>

<script src="rules.js"></script>
<script src="i18n.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
<script src="tests.js"></script>
<script src="ui.js"></script>
</body>
</html>
