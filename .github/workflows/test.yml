# Runs every check on GitHub's computers whenever main gets a push or a pull request is opened.
# A push to main also goes live at once (GitHub Pages and the Render server), so this is how a
# broken push gets noticed. Results: the repo's "Actions" tab, or `gh run list`.
# (YAML: indentation is structure, as in Python; "- " starts a list item.)
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Playwright for the browser tests, and the server's one library (ws). The root has no
      # lockfile in git (.gitignore), so `npm install` there; `npm ci` needs one, as server/ has.
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: server
      # The same commands as README "Testing". Each exits with an error code when a check
      # fails, which fails the run. The self-tests in tests.js run inside the browser tests,
      # several of which fail on any console error.
      - run: node tools/stress.js 20
      - run: npm test
        working-directory: server
      # The failing checks are repeated as "::error::" lines, which GitHub shows at the top of
      # the run's page (no need to dig through the log). set +e: carry on to the grep even
      # when the tests fail; the last line then exits with the tests' own result.
      - run: |
          set +e
          npm run test:browser 2>&1 | tee browser.log
          status=${PIPESTATUS[0]}
          grep -E "^FAIL|^ERRORS: [^n]|Error:" browser.log | head -20 | sed 's/^/::error::/'
          exit $status
